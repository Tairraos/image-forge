# 三平台发布流水线：push 版本号 tag（如 1.0.104，推荐用 pnpm release 一键完成）或手动触发后，
# 在 macOS / Windows / Linux 三种云端 runner 上并行构建安装包，
# 自动创建并直接公开 Release；各平台产物由先完成的 job 陆续追加到同一个 Release。
#
# 产物：
#   - macOS (Apple Silicon)：.app + .dmg（未做 Developer ID 签名/公证，见 docs 说明）
#   - Windows：NSIS 安装器 .exe
#   - Linux：.AppImage + .deb
#
# 如需覆盖 Intel Mac，取消下方 matrix 中被注释的条目即可。
# 所有第三方 action 固定到 commit SHA（防 tag 被劫持）；升级时把 SHA 换成目标版本对应的 commit。
name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon（M 系列）
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          # - platform: macos-latest # Intel Mac（按需启用）
          #   args: '--target x86_64-apple-darwin --bundles app,dmg'
          - platform: ubuntu-22.04 # AppImage 打包对 22.04 兼容性最好
            args: '--bundles appimage,deb'
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # 自动读取 package.json 的 packageManager 字段

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24 # 与本机开发版本保持一致
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          # 仅 mac runner 需要额外 target，避免拖慢 windows/linux
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate icon set
        # 仓库只提交 app-icon.png / icon.png 源图，与本地 release.mjs 流程一致，构建前生成完整图标集
        run: pnpm tauri icon src-tauri/icons/app-icon.png

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__ # 自动替换为 tauri.conf.json 中的版本号
          releaseName: 'ImageForge __VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false # 构建完成即自动公开发布
          prerelease: false
          args: ${{ matrix.args }}
