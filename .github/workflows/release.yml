# 多平台发布流水线：推送版本 tag（如 v1.0.103；裸版本号 1.0.103 也触发，兼容 pnpm release 的老习惯）
# → guard 校验 tag 版本与三处版本号一致并预建 Release → 四平台并行构建 → 产物自动传到 Release。
#
# 完整产物形态是 7 个：aarch64/x86_64 双 dmg + msi + NSIS setup.exe + deb + rpm + AppImage。
# 没配应用内更新器，所以不会有 .app.tar.gz / .sig 产物，属正常现象。
#
# 构建与上传拆成独立步骤：构建失败时把日志尾部写成 check-run 注解——
# 没有仓库管理员权限时读不到原始日志（API 下载 403），注解是无认证可读的唯一排障通道。
# 所有第三方 action 固定到 commit SHA（防 tag 被劫持）；升级时把 SHA 换成目标版本对应的 commit。
name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: tag 版本与三处版本号一致
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ] || [ "$conf" != "$tag" ] || [ "$cargo" != "$tag" ]; then
            echo "tag 是 $tag，但 package.json=$pkg / tauri.conf.json=$conf / Cargo.toml=$cargo；请把三处版本号改一致后重新打 tag。"
            exit 1
          fi
      - name: 预建 Release（已存在则跳过，保留既有说明文字）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "ImageForge $GITHUB_REF_NAME" \
              --notes "安装包未签名：macOS 首次打开请右键选择「打开」；Windows 首次运行如遇 SmartScreen 提示，选择「仍要运行」。"

  publish:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            rust-targets: ''
            args: ''
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # 自动读取 package.json 的 packageManager 字段
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24 # 与本机开发版本保持一致
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: 安装交叉编译 target
        # 仓库根的 rust-toolchain.toml 把 toolchain 钉在固定版本，会覆盖这里安装的 stable；
        # rustup target add 遵循该 override，把 target 装到实际使用的 toolchain 上
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - name: 安装 Linux 打包依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: 构建安装包
        id: build
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri build ${{ matrix.args }} 2>&1 | tee build.log
      - name: 构建失败时把报错写进注解
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          LOG=build.log
          if [ -f "$LOG" ]; then
            grep -nE "^error|error\[|error:|Error:|cannot |failed|not found|No such|失败|错误|Traceback" "$LOG" | tail -n 10 > errors.txt || true
            [ -s errors.txt ] || tail -n 10 "$LOG" > errors.txt
          else
            echo "未生成 build.log（构建未开始或输出未捕获）" > errors.txt
          fi
          while IFS= read -r line; do echo "::error title=Build failure::$line"; done < errors.txt
          { echo "### 构建失败：日志尾部"; echo '```'; tail -n 120 "$LOG" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 1
      - name: 上传安装包到 Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 产物路径随构建方式不同：无 --target 时在 src-tauri/target/release/bundle，
          # 带 --target <triple> 时在 src-tauri/target/<triple>/release/bundle，统一用通配匹配两种情况。
          find src-tauri/target -path '*/release/bundle/*' -type f \( \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
            -name '*.sig' -o -name '*.zip' \) -print > files.txt
          # .app.tar.gz 只取 macOS 打包目录；deb 暂存目录里的 control/data.tar.gz 是中间产物，不能上传
          find src-tauri/target -path '*/release/bundle/macos/*' -type f -name '*.tar.gz' -print >> files.txt
          count=$(wc -l < files.txt | tr -d ' ')
          echo "找到 $count 个安装包："
          sed 's/^/  /' files.txt
          if [ "$count" -eq 0 ]; then
            echo "构建成功但没有找到安装包，检查 bundle.targets 配置。"
            exit 1
          fi
          # 清掉历史误传的打包中间产物（已存在才删，失败不影响上传）
          for stray in control.tar.gz data.tar.gz; do
            gh release delete-asset "$GITHUB_REF_NAME" "$stray" --yes >/dev/null 2>&1 || true
          done
          while IFS= read -r file; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done < files.txt
